name: Fase 0 - Exportar modelo ONNX e validar alinhamento

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --quiet \
            "sentence-transformers==2.7.0" \
            "transformers==4.40.2" \
            "onnx==1.16.2" \
            "onnxruntime==1.20.1" \
            "numpy<2" \
            "huggingface-hub>=0.23,<1" \
            sympy

      - name: Baixar modelo base e tokenizer de referencia
        run: |
          python <<'PYEOF'
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          XENOVA_ID = "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
          ST_ID = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          cache = Path("model_cache")
          (cache / "onnx").mkdir(parents=True, exist_ok=True)

          def download(repo_id, filename, required=True):
              try:
                  path = hf_hub_download(
                      repo_id=repo_id,
                      filename=filename,
                      local_dir=str(cache),
                  )
                  size = Path(path).stat().st_size
                  print(f"{filename}: {size} bytes [{repo_id}]")
              except Exception:
                  if required:
                      raise
                  print(f"{filename}: optional, not found")

          download(XENOVA_ID, "onnx/model.onnx")
          for filename in (
              "tokenizer.json",
              "tokenizer_config.json",
              "config.json",
          ):
              download(ST_ID, filename)
          for filename in (
              "special_tokens_map.json",
              "sentencepiece.bpe.model",
              "vocab.txt",
          ):
              download(ST_ID, filename, required=False)
          PYEOF

      - name: Embutir mean pooling e normalizacao L2 no grafo
        run: |
          python <<'PYEOF'
          from pathlib import Path
          import onnx
          from onnx import TensorProto, helper, numpy_helper
          import numpy as np

          source = Path("model_cache/onnx/model.onnx")
          target = Path("model_cache/model_fp32.onnx")
          model = onnx.load(source)
          graph = model.graph
          standard_opset = next(
              item.version
              for item in model.opset_import
              if item.domain in ("", "ai.onnx")
          )
          print(f"Base model: ir_version={model.ir_version}, opset={standard_opset}")
          if standard_opset != 11:
              raise RuntimeError(
                  f"Expected ai.onnx opset 11, found {standard_opset}"
              )

          hidden = next(
              output for output in graph.output
              if len(output.type.tensor_type.shape.dim) == 3
          )
          input_names = {item.name for item in graph.input}
          if "attention_mask" not in input_names:
              raise RuntimeError("attention_mask not found in model inputs")

          graph.initializer.extend([
              numpy_helper.from_array(np.array([1e-12], dtype=np.float32), "epsilon"),
          ])
          graph.node.extend([
              helper.make_node(
                  "Cast", ["attention_mask"], ["attention_mask_float"],
                  to=TensorProto.FLOAT,
              ),
              helper.make_node(
                  "Unsqueeze",
                  ["attention_mask_float"],
                  ["attention_mask_3d"],
                  axes=[2],
              ),
              helper.make_node(
                  "Mul",
                  [hidden.name, "attention_mask_3d"],
                  ["masked_tokens"],
              ),
              helper.make_node(
                  "ReduceSum",
                  ["masked_tokens"],
                  ["token_sum"],
                  axes=[1],
                  keepdims=0,
              ),
              helper.make_node(
                  "ReduceSum",
                  ["attention_mask_3d"],
                  ["mask_sum"],
                  axes=[1],
                  keepdims=0,
              ),
              helper.make_node(
                  "Clip",
                  ["mask_sum", "epsilon"],
                  ["mask_sum_safe"],
              ),
              helper.make_node(
                  "Div",
                  ["token_sum", "mask_sum_safe"],
                  ["mean_pooled"],
              ),
              helper.make_node(
                  "Mul",
                  ["mean_pooled", "mean_pooled"],
                  ["embedding_squared"],
              ),
              helper.make_node(
                  "ReduceSum",
                  ["embedding_squared"],
                  ["embedding_square_sum"],
                  axes=[1],
                  keepdims=1,
              ),
              helper.make_node(
                  "Sqrt",
                  ["embedding_square_sum"],
                  ["embedding_norm"],
              ),
              helper.make_node(
                  "Clip",
                  ["embedding_norm", "epsilon"],
                  ["embedding_norm_safe"],
              ),
              helper.make_node(
                  "Div",
                  ["mean_pooled", "embedding_norm_safe"],
                  ["sentence_embedding"],
              ),
          ])

          del graph.output[:]
          graph.output.extend([
              helper.make_tensor_value_info(
                  "sentence_embedding",
                  TensorProto.FLOAT,
                  ["batch_size", 384],
              )
          ])
          onnx.checker.check_model(model)
          onnx.save(model, target)
          print(f"model_fp32.onnx: {target.stat().st_size} bytes")
          PYEOF

      - name: Converter modelo final para FP16
        run: |
          python <<'PYEOF'
          from pathlib import Path
          import onnx
          from onnxruntime.transformers.float16 import convert_float_to_float16

          source = Path("model_cache/model_fp32.onnx")
          target = Path("model_cache/model.onnx")
          model = convert_float_to_float16(
              onnx.load(source),
              keep_io_types=True,
          )
          onnx.checker.check_model(model)
          onnx.save(model, target)
          print(f"model.onnx: {target.stat().st_size} bytes")
          PYEOF

      - name: Validar alinhamento com referencia e embeddings armazenados
        run: |
          python <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          import numpy as np
          import onnxruntime as ort
          from sentence_transformers import SentenceTransformer
          from transformers import AutoTokenizer

          MODEL_ID = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          THRESHOLD = 0.99
          cache = Path("model_cache")
          embeddings_dir = Path("assets/embeddings")

          tokenizer = AutoTokenizer.from_pretrained(cache)
          reference = SentenceTransformer(MODEL_ID)
          sessions = {
              "fp32": ort.InferenceSession(
                  str(cache / "model_fp32.onnx"),
                  providers=["CPUExecutionProvider"],
              ),
              "fp16": ort.InferenceSession(
                  str(cache / "model.onnx"),
                  providers=["CPUExecutionProvider"],
              ),
          }

          def embed_onnx(session, texts):
              encoded = tokenizer(
                  texts,
                  padding=True,
                  truncation=True,
                  max_length=128,
                  return_tensors="np",
              )
              input_names = {item.name for item in session.get_inputs()}
              feed = {
                  name: encoded[name].astype(np.int64)
                  for name in ("input_ids", "attention_mask", "token_type_ids")
                  if name in input_names and name in encoded
              }
              if "token_type_ids" in input_names and "token_type_ids" not in feed:
                  feed["token_type_ids"] = np.zeros_like(
                      encoded["input_ids"],
                      dtype=np.int64,
                  )
              output = session.run(["sentence_embedding"], feed)[0]
              if output.ndim != 2 or output.shape[1] != 384:
                  raise RuntimeError(f"unexpected output shape: {output.shape}")
              return output

          def cosine(left, right):
              return float(np.dot(left, right) / (
                  np.linalg.norm(left) * np.linalg.norm(right) + 1e-12
              ))

          phrases = [
              "impressora puxando varias folhas",
              "erro de fusor",
              "trocar cartucho de toner",
              "papel atolado na bandeja 2",
          ]
          reference_vectors = reference.encode(
              phrases,
              normalize_embeddings=True,
          )

          stored_texts = []
          stored_vectors = []
          for json_file in sorted(embeddings_dir.glob("*.json")):
              data = json.loads(json_file.read_text(encoding="utf-8"))
              chunks = data[next(iter(data))]
              for chunk in chunks[:2]:
                  stored_texts.append(chunk["t"])
                  stored_vectors.append(np.asarray(chunk["e"], dtype=np.float32))

          report = {
              "threshold": THRESHOLD,
              "phrases": {},
              "stored_chunks": {},
          }
          failures = []

          for model_name, session in sessions.items():
              phrase_vectors = embed_onnx(session, phrases)
              phrase_scores = [
                  cosine(reference_vectors[index], phrase_vectors[index])
                  for index in range(len(phrases))
              ]
              report["phrases"][model_name] = phrase_scores
              print(f"\n{model_name} vs sentence-transformers:")
              for text, score in zip(phrases, phrase_scores):
                  ok = score >= THRESHOLD
                  print(f"  {score:.6f} {'OK' if ok else 'FAIL'} {text!r}")
                  if not ok:
                      failures.append((model_name, "phrase", text, score))

              stored_outputs = embed_onnx(session, stored_texts)
              stored_scores = [
                  cosine(stored_vectors[index], stored_outputs[index])
                  for index in range(len(stored_texts))
              ]
              report["stored_chunks"][model_name] = stored_scores
              print(f"\n{model_name} vs stored embeddings:")
              for text, score in zip(stored_texts, stored_scores):
                  ok = score >= THRESHOLD
                  print(f"  {score:.6f} {'OK' if ok else 'FAIL'} {text[:70]!r}")
                  if not ok:
                      failures.append((model_name, "stored", text[:70], score))

          (cache / "alignment_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if failures:
              print(f"\nAlignment failed: {len(failures)} result(s) below {THRESHOLD}")
              sys.exit(1)
          print(f"\nAll alignment checks passed with cosine >= {THRESHOLD}.")
          PYEOF

      - name: Preparar assets e checksum
        run: |
          mkdir -p release_assets
          cp model_cache/model.onnx release_assets/model.onnx
          cp model_cache/tokenizer.json release_assets/
          cp model_cache/tokenizer_config.json release_assets/
          cp model_cache/config.json release_assets/
          for file in special_tokens_map.json sentencepiece.bpe.model vocab.txt; do
            if [ -f "model_cache/$file" ]; then
              cp "model_cache/$file" release_assets/
            fi
          done

          cd release_assets
          sha256sum model.onnx | tee model.onnx.sha256
          sha256sum --check model.onnx.sha256
          echo "Published model SHA-256:"
          cat model.onnx.sha256
          ls -lh

      - name: Criar GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="onnx-model-$(date -u +%Y%m%d-%H%M%S)"
          MODEL_SIZE=$(stat --printf="%s" release_assets/model.onnx)
          MODEL_SHA=$(cut -d' ' -f1 release_assets/model.onnx.sha256)
          MIN_PHRASE=$(python -c "import json; r=json.load(open('model_cache/alignment_report.json')); print(f\"{min(r['phrases']['fp16']):.6f}\")")
          MIN_STORED=$(python -c "import json; r=json.load(open('model_cache/alignment_report.json')); print(f\"{min(r['stored_chunks']['fp16']):.6f}\")")

          cat > release_notes.md <<NOTES
          ## ONNX model - paraphrase-multilingual-MiniLM-L12-v2

          Modelo FP16 com mean pooling por attention mask e normalizacao L2
          embutidos no grafo. Tokenizacao usa os assets do modelo original
          sentence-transformers (abordagem B).

          - Tamanho: ${MODEL_SIZE} bytes
          - SHA-256: \`${MODEL_SHA}\`
          - Menor cosseno nas frases de referencia: ${MIN_PHRASE}
          - Menor cosseno contra embeddings armazenados: ${MIN_STORED}
          - Criterio obrigatorio: >= 0.99 em todos

          A Fase 1 deve baixar \`model.onnx.sha256\`, validar o hash de
          \`model.onnx\` e somente entao carregar o modelo.
          NOTES

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ONNX model - paraphrase-multilingual-MiniLM-L12-v2 [Fase 0]" \
            --notes-file release_notes.md \
            release_assets/*

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Release: ${RELEASE_URL}"
          echo "model.onnx: ${RELEASE_URL}/download/${TAG}/model.onnx"
          echo "model.onnx.sha256: ${RELEASE_URL}/download/${TAG}/model.onnx.sha256"
          echo "RELEASE_URL=${RELEASE_URL}" >> "$GITHUB_ENV"
          echo "MODEL_SHA=${MODEL_SHA}" >> "$GITHUB_ENV"
          echo "MODEL_SIZE=${MODEL_SIZE}" >> "$GITHUB_ENV"
          echo "MIN_PHRASE=${MIN_PHRASE}" >> "$GITHUB_ENV"
          echo "MIN_STORED=${MIN_STORED}" >> "$GITHUB_ENV"

      - name: Resumo do job
        if: always()
        run: |
          {
            echo "## Fase 0 - Resultado"
            echo
            if [ -f release_assets/model.onnx.sha256 ]; then
              echo "- model.onnx: ${MODEL_SIZE:-?} bytes"
              echo "- SHA-256: \`${MODEL_SHA:-?}\`"
              echo "- menor cosseno (frases): ${MIN_PHRASE:-?}"
              echo "- menor cosseno (chunks armazenados): ${MIN_STORED:-?}"
              echo "- release: ${RELEASE_URL:-nao publicado}"
              echo
              echo '```text'
              cat release_assets/model.onnx.sha256
              echo '```'
            else
              echo "- modelo nao publicado; consulte o passo que falhou."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
