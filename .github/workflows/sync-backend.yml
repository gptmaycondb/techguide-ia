name: Sync backend to manuais-hp

on:
  push:
    branches: [main]
    paths:
      - 'backend/server.js'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/sync-backend.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout techguide-ia
        uses: actions/checkout@v4

      - name: Checkout manuais-hp
        uses: actions/checkout@v4
        with:
          repository: gptmaycondb/manuais-hp
          token: ${{ secrets.MANUAIS_HP_TOKEN }}
          path: manuais-hp

      - name: Sync backend atomically
        run: |
          cp backend/server.js manuais-hp/server.js
          cp backend/package.json manuais-hp/package.json
          cp backend/package-lock.json manuais-hp/package-lock.json

          cd manuais-hp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Backend already synchronized"
            exit 0
          fi

          git commit -m "sync: backend from techguide-ia@${GITHUB_SHA:0:7}"
          git push origin HEAD:main
